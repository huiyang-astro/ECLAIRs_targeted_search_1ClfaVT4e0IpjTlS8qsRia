let snrIndex=0;
let countIndex=0;

let dtRange=[dtMinAllowed,dtMaxAllowed];

const dtSlider=document.getElementById("dtSlider");

noUiSlider.create(dtSlider,{
    start:[dtMinAllowed,dtMaxAllowed],
    connect:true,
    step:0.1,
    range:{
        min:dtMinAllowed,
        max:dtMaxAllowed
    },
    tooltips:[true,true],
    format:{
        to:function(v){return Number(v).toFixed(1);},
        from:function(v){return Number(v);}
    }
});

dtSlider.style.position="relative";

function addMarker(value,color,label){

    if(value<dtMinAllowed || value>dtMaxAllowed)
        return;

    const pct=
        100*(value-dtMinAllowed)/(dtMaxAllowed-dtMinAllowed);

    const line=document.createElement("div");

    line.style.position="absolute";
    line.style.left=pct+"%";
    line.style.top="-10px";
    line.style.bottom="-10px";
    line.style.width="2px";
    line.style.background=color;
    line.style.pointerEvents="none";

    const text=document.createElement("div");

    text.innerHTML=label;

    text.style.position="absolute";
    text.style.top="-18px";
    text.style.left="50%";
    text.style.transform="translateX(-50%)";
    text.style.fontSize="10px";
    text.style.whiteSpace="nowrap";

    line.appendChild(text);

    dtSlider.appendChild(line);
}

addMarker(0,"red","0");

addMarker(17.5,"blue","max SNR");

function updatePlot(){

    document.getElementById("snrValue").textContent=
        snrLevels[snrIndex].toFixed(1);

    document.getElementById("countValue").textContent=
        countLevels[countIndex];

    document.getElementById("dtMin").textContent=
        dtRange[0].toFixed(1);

    document.getElementById("dtMax").textContent=
        dtRange[1].toFixed(1);

    const x=[];
    const y=[];
    const custom=[];

    for(const p of data){

        if(
            p.snr>=snrLevels[snrIndex] &&
            p.count>=countLevels[countIndex] &&
            p.dt>=dtRange[0] &&
            p.dt<=dtRange[1]
        ){

            x.push(p.x);
            y.push(p.y);
            custom.push(p.custom);

        }

    }

    Plotly.restyle(
        gd,
        {
            x:[x],
            y:[y],
            customdata:[custom]
        },
        [1]
    );

}

document.getElementById("snrSlider").oninput=function(){
    snrIndex=parseInt(this.value);
    updatePlot();
};

document.getElementById("countSlider").oninput=function(){
    countIndex=parseInt(this.value);
    updatePlot();
};

dtSlider.noUiSlider.on("update",function(values){

    dtRange=[
        parseFloat(values[0]),
        parseFloat(values[1])
    ];

    updatePlot();

});

gd.on("plotly_click",function(d){

    if(d.points.length &&
       d.points[0].curveNumber===1){

        window.open(
            d.points[0].customdata[0],
            "_blank"
        );

    }

});

updatePlot();

</script>

</body>
</html>
