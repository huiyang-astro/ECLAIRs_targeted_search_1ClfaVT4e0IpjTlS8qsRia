    dtSlider.appendChild(line);
}

addMarker(0,"red","0");

addMarker(20.48,"blue","max SNR");

function updatePlot(){

    document.getElementById("snrValue").textContent=
        snrLevels[snrIndex].toFixed(1);

    document.getElementById("countValue").textContent=
        countLevels[countIndex];

    document.getElementById("dtMin").textContent=
        dtRange[0].toFixed(1);

    document.getElementById("dtMax").textContent=
        dtRange[1].toFixed(1);

    const x=[];
    const y=[];
    const custom=[];

    for(const p of data){

        if(
            p.snr>=snrLevels[snrIndex] &&
            p.count>=countLevels[countIndex] &&
            p.dt>=dtRange[0] &&
            p.dt<=dtRange[1]
        ){

            x.push(p.x);
            y.push(p.y);
            custom.push(p.custom);

        }

    }

    Plotly.restyle(
        gd,
        {
            x:[x],
            y:[y],
            customdata:[custom]
        },
        [1]
    );

}

document.getElementById("snrSlider").oninput=function(){
    snrIndex=parseInt(this.value);
    updatePlot();
};

document.getElementById("countSlider").oninput=function(){
    countIndex=parseInt(this.value);
    updatePlot();
};

dtSlider.noUiSlider.on("update",function(values){

    dtRange=[
        parseFloat(values[0]),
        parseFloat(values[1])
    ];

    updatePlot();

});

gd.on("plotly_click",function(d){

    if(d.points.length &&
       d.points[0].curveNumber===1){

        window.open(
            d.points[0].customdata[0],
            "_blank"
        );

    }

});

updatePlot();

</script>

</body>
</html>
