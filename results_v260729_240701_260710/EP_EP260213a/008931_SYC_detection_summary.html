            p.count>=countLevels[countIndex] &&
            p.dt>=dtRange[0] &&
            p.dt<=dtRange[1]
        ){

            x.push(p.x);
            y.push(p.y);
            custom.push(p.custom);

        }

    }

    Plotly.restyle(
        gd,
        {
            x:[x],
            y:[y],
            customdata:[custom]
        },
        [1]
    );

}

document.getElementById("snrSlider").oninput=function(){
    snrIndex=parseInt(this.value);
    updatePlot();
};

document.getElementById("countSlider").oninput=function(){
    countIndex=parseInt(this.value);
    updatePlot();
};

dtSlider.noUiSlider.on("update",function(values){

    dtRange=[
        parseFloat(values[0]),
        parseFloat(values[1])
    ];

    updatePlot();

});

gd.on("plotly_click",function(d){

    if(d.points.length &&
       d.points[0].curveNumber===1){

        window.open(
            d.points[0].customdata[0],
            "_blank"
        );

    }

});

updatePlot();

</script>

</body>
</html>
